name: Import Branch Across Repositories

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repository URL (e.g., https://github.com/user/source-repo.git)"
        required: true
        type: string

      source_branch:
        description: "Source Branch Name"
        required: true
        type: string

      target_repo_url:
        description: "Target Repository URL (e.g., https://github.com/Justadeayo/target-repo.git)"
        required: true
        type: string

      target_branch:
        description: "Target Branch Name (to create or update in target)"
        required: true
        type: string

      force_push:
        description: "Force push to target branch if it already exists?"
        required: true
        type: boolean
        default: false

jobs:
  import-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git User
        run: |
          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@users.noreply.github.com"

      - name: Fetch from Source and Push to Target
        env:
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
        run: |
          # 1. Initialize an empty local Git directory
          mkdir repo-sync && cd repo-sync
          git init

          # 2. Add and fetch the branch from the Source repo
          echo "Fetching '${{ inputs.source_branch }}' from source..."
          git remote add source "${{ inputs.source_repo_url }}"
          git fetch source "${{ inputs.source_branch }}"

          # 3. Create tracking branch locally
          git checkout -b "${{ inputs.target_branch }}" FETCH_HEAD

          # 4. Inject PAT into Target Repository URL for authentication
          TARGET_URL="${{ inputs.target_repo_url }}"
          AUTH_TARGET_URL=$(echo "$TARGET_URL" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")

          # 5. Push branch to Target
          git remote add target "$AUTH_TARGET_URL"
          
          FLAGS=""
          if [ "${{ inputs.force_push }}" = "true" ]; then
            FLAGS="--force"
          fi

          echo "Pushing branch '${{ inputs.target_branch }}' to target repository..."
          git push $FLAGS target "${{ inputs.target_branch }}"

          # 6. Verify operation
          if [ $? -eq 0 ]; then
            echo "Successfully imported branch '${{ inputs.source_branch }}' into '${{ inputs.target_repo_url }}' as '${{ inputs.target_branch }}'."
          else
            echo "Failed to push to target repository."
            exit 1
          fi
