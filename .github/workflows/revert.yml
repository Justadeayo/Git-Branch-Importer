name: Revert Multiple Commits

on:
  workflow_dispatch:
    inputs:
      commit_shas:
        description: "Space or newline-separated Commit SHAs to revert (e.g., sha1 sha2 sha3)"
        required: true
        type: string

      target_repo_url:
        description: "Target Repository URL (e.g., https://github.com/Justadeayo/target-repo.git)"
        required: true
        type: string

      target_branch:
        description: "Target Branch Name to revert commits on"
        required: true
        type: string

jobs:
  revert-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH Key for Signing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Git & SSH Signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true

      - name: Fetch and Revert Commits
        env:
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          GIT_COMMITTER_NAME: "Justus"
          GIT_COMMITTER_EMAIL: "Justadeayo@users.noreply.github.com"
          COMMIT_LIST: ${{ inputs.commit_shas }}
        run: |
          mkdir commit-sync && cd commit-sync
          git init
          
          TARGET_URL="${{ inputs.target_repo_url }}"
          AUTH_TARGET_URL=$(echo "$TARGET_URL" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")
          
          echo "Fetching target branch '${{ inputs.target_branch }}'..."
          git remote add target "$AUTH_TARGET_URL"
          git fetch target "${{ inputs.target_branch }}"
          git checkout -b "${{ inputs.target_branch }}" FETCH_HEAD

          for sha in $COMMIT_LIST; do
            echo "----------------------------------------------------"
            echo "Reverting commit: $sha"
            if git revert -s --no-edit "$sha"; then
              echo "Successfully reverted $sha"
            else
              echo "Revert conflict encountered for $sha. Attempting fallback resolution..."
             
              git checkout --theirs .
              git add .
              if git revert -s --continue --no-edit; then
                echo "Resolved conflicts and reverted $sha"
              else
                echo "::warning::Skipping unresolvable revert for commit $sha"
                git revert --abort || true
              fi
            fi
          done

          echo "Pushing changes back to target repository..."
          git push target "${{ inputs.target_branch }}"
          