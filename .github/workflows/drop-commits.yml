name: Drop Commits (Rewrite History)

on:
  workflow_dispatch:
    inputs:
      commit_shas:
        description: "Space or newline-separated Commit SHAs to drop from history"
        required: true
        type: string

      target_repo_url:
        description: "Target Repository URL (e.g., https://github.com/Justadeayo/target-repo.git)"
        required: true
        type: string

      target_branch:
        description: "Target Branch Name to drop commits from (history will be rewritten)"
        required: true
        type: string

jobs:
  drop-commits:
    runs-on: ubuntu-latest
    outputs:
      tgt_hash: ${{ steps.key.outputs.tgt }}
    steps:
      - name: Set up SSH Key for Signing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Git & SSH Signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          git config --global user.name "Justus"
          git config --global user.email "184845233+Justadeayo@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true

      - name: Compute Cache Keys
        id: key
        env:
          TGT: ${{ inputs.target_repo_url }}
        run: |
          hash() { printf '%s' "$1" | tr 'A-Z' 'a-z' | sed -E 's#(\.git)?/*$##' | sha256sum | cut -c1-16; }
          echo "tgt=$(hash "$TGT")" >> $GITHUB_OUTPUT

      - name: Restore Target Cache
        uses: actions/cache/restore@v4
        with:
          path: cache/tgt.git
          key: repo-${{ steps.key.outputs.tgt }}-none
          restore-keys: repo-${{ steps.key.outputs.tgt }}-

      - name: Sync Repo Caches
        id: sync
        env:
          GIT_TERMINAL_PROMPT: 0
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          TGT: ${{ inputs.target_repo_url }}
          BR: ${{ inputs.target_branch }}
        run: |
          init_repo() { [ -d "$1" ] || git init -q --bare "$1"; }
          sync_branch() {
            init_repo "$1"
            remote=$(git ls-remote "$2" "refs/heads/$3" | awk -v r="refs/heads/$3" '$2==r{print $1}')
            if [ -z "$remote" ]; then
              echo "::error::Branch '$3' not found in remote"
              exit 1
            fi
            have=$(git --git-dir="$1" rev-parse -q --verify "refs/heads/$3" || true)
            if [ "$remote" = "$have" ]; then
              echo "Cache up to date for '$3' at $remote"
              return 0
            fi
            git --git-dir="$1" fetch -q --no-tags --no-write-fetch-head "$2" "+refs/heads/$3:refs/heads/$3"
            echo "$4=true" >> $GITHUB_OUTPUT
          }

          AUTH_TGT=$(echo "$TGT" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")
          mkdir -p cache
          sync_branch cache/tgt.git "$AUTH_TGT" "$BR" tgt_changed
          if grep -qs "x-access-token" cache/*.git/config cache/*.git/FETCH_HEAD; then
            echo "::error::Credentials found in repo cache"
            exit 1
          fi

      - name: Save Target Cache
        if: steps.sync.outputs.tgt_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/tgt.git
          key: repo-${{ steps.key.outputs.tgt }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop Commits and Force Push
        env:
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          GIT_COMMITTER_NAME: "Justus"
          GIT_COMMITTER_EMAIL: "184845233+Justadeayo@users.noreply.github.com"
          TGT: ${{ inputs.target_repo_url }}
          BR: ${{ inputs.target_branch }}
          COMMIT_LIST: ${{ inputs.commit_shas }}
        run: |
          WS="$GITHUB_WORKSPACE"
          AUTH_TGT=$(echo "$TGT" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")
          mkdir -p work && cd work
          git init -q
          printf '%s\n' "$WS/cache/tgt.git/objects" > .git/objects/info/alternates
          git checkout -q -B "$BR" "$(git --git-dir="$WS/cache/tgt.git" rev-parse "refs/heads/$BR")"

          tip=$(git rev-parse HEAD)
          drops=()
          for sha in $COMMIT_LIST; do
            full=$(git rev-parse --verify -q "$sha^{commit}") || { echo "::error::Commit $sha not found"; exit 1; }
            git merge-base --is-ancestor "$full" "$tip" || { echo "::error::Commit $sha is not on $BR"; exit 1; }
            drops+=("$full")
          done

          oldest=""
          for c in $(git rev-list --reverse "$tip"); do
            for d in "${drops[@]}"; do
              if [ "$c" = "$d" ]; then
                oldest=$c
                break 2
              fi
            done
          done

          if parent=$(git rev-parse -q --verify "$oldest^"); then
            base_arg="$parent"
          else
            base_arg="--root"
          fi

          cat > "$RUNNER_TEMP/drop-editor.sh" <<'EOF'
          #!/bin/bash
          set -e
          todo="$1"
          awk -v drops="$DROP_SHAS" 'BEGIN{n=split(drops,a," ")} $1=="pick"{for(i=1;i<=n;i++) if(index(a[i],$2)==1){$1="drop"}} {print}' "$todo" > "$todo.new"
          mv "$todo.new" "$todo"
          EOF

          export DROP_SHAS="${drops[*]}"
          export GIT_SEQUENCE_EDITOR="bash $RUNNER_TEMP/drop-editor.sh"
          export GIT_EDITOR=true

          echo "Dropping ${#drops[@]} commit(s) from $BR (base: $base_arg)"
          if ! git rebase -i -X theirs $base_arg; then
            for i in $(seq 1 500); do
              [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ] || break
              git checkout -q --theirs . 2>/dev/null || true
              git add -A
              git rebase --continue >/dev/null 2>&1 || true
            done
          fi

          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git rebase --abort || true
            echo "::error::Could not drop the requested commits cleanly"
            exit 1
          fi

          for d in "${drops[@]}"; do
            if git merge-base --is-ancestor "$d" HEAD; then
              echo "::error::Commit $d is still reachable after rewrite"
              exit 1
            fi
          done

          git push --force "$AUTH_TGT" "HEAD:refs/heads/$BR"

  Cache_Cleanup:
    needs: drop-commits
    if: ${{ needs.drop-commits.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_LIMIT_GB: 8
      HASHES: ${{ needs.drop-commits.outputs.tgt_hash }}
    steps:
      - name: Prune old repo caches
        run: |
          for h in $HASHES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "repo-${h}-" --sort created_at --order desc --limit 100 --json id | jq -r '.[1:][].id' | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
          done
          LIMIT=$((CACHE_LIMIT_GB * 1024 * 1024 * 1024))
          gh cache list --repo "$GITHUB_REPOSITORY" --key "repo-" --sort last_accessed_at --order desc --limit 100 --json id,sizeInBytes | jq -r --argjson l "$LIMIT" 'foreach .[] as $c (0; . + $c.sizeInBytes; {id: $c.id, total: .}) | select(.total > $l) | .id' | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
