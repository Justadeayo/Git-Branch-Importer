name: Cherry-Pick Multiple Commits

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      commit_shas:
        description: "Space or newline-separated Commit SHAs"
        required: true
        type: string

      target_repo_url:
        description: "Target Repository URL"
        required: true
        type: string

      target_branch:
        description: "Target Branch Name to apply commits onto"
        required: true
        type: string

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH Key for Signing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Git & SSH Signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true

      - name: Fetch and Cherry-Pick Commits
        env:
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          GIT_COMMITTER_NAME: "Justus"
          GIT_COMMITTER_EMAIL: "Justadeayo@users.noreply.github.com"
          COMMIT_LIST: ${{ inputs.commit_shas }}
        run: |
          mkdir commit-sync && cd commit-sync
          git init

          TARGET_URL="${{ inputs.target_repo_url }}"
          AUTH_TARGET_URL=$(echo "$TARGET_URL" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")

          echo "Fetching target branch '${{ inputs.target_branch }}'..."
          git remote add target "$AUTH_TARGET_URL"
          git fetch target "${{ inputs.target_branch }}"
          git checkout -b "${{ inputs.target_branch }}" FETCH_HEAD

          echo "Adding source repository remote..."
          git remote add source "${{ inputs.source_repo_url }}"
          git fetch source --no-tags

          for sha in $COMMIT_LIST; do
            echo "----------------------------------------------------"
            echo "Processing commit: $sha"
            
            if git cherry-pick -s -X theirs "$sha"; then
              echo "Successfully cherry-picked and signed $sha"
            else
              echo "Cherry-pick conflict encountered for $sha. Attempting fallback resolution..."
              
              git checkout --theirs .
              git add .
              if git cherry-pick -s --continue --no-edit; then
                echo "Resolved conflicts and applied $sha"
              else
                echo "::warning::Skipping unresolvable commit $sha"
                git cherry-pick --abort || true
              fi
            fi
          done

          echo "Pushing changes back to target repository..."
          git push target "${{ inputs.target_branch }}"
