name: Cherry-Pick Multiple Commits

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: "Source Repository URL"
        required: true
        type: string

      commit_shas:
        description: "Space or newline-separated Commit SHAs"
        required: true
        type: string

      target_repo_url:
        description: "Target Repository URL"
        required: true
        type: string

      target_branch:
        description: "Target Branch Name"
        required: true
        type: string

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    outputs:
      src_hash: ${{ steps.key.outputs.src }}
      tgt_hash: ${{ steps.key.outputs.tgt }}
    steps:
      - name: Set up SSH Key for Signing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure Git & SSH Signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key

          git config --global user.name "Justus"
          git config --global user.email "Justadeayo@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true

      - name: Compute Cache Keys
        id: key
        env:
          SRC: ${{ inputs.source_repo_url }}
          TGT: ${{ inputs.target_repo_url }}
        run: |
          hash() { printf '%s' "$1" | tr 'A-Z' 'a-z' | sed -E 's#(\.git)?/*$##' | sha256sum | cut -c1-16; }
          echo "src=$(hash "$SRC")" >> $GITHUB_OUTPUT
          echo "tgt=$(hash "$TGT")" >> $GITHUB_OUTPUT

      - name: Restore Source Cache
        uses: actions/cache/restore@v4
        with:
          path: cache/src.git
          key: repo-${{ steps.key.outputs.src }}-none
          restore-keys: repo-${{ steps.key.outputs.src }}-

      - name: Restore Target Cache
        uses: actions/cache/restore@v4
        with:
          path: cache/tgt.git
          key: repo-${{ steps.key.outputs.tgt }}-none
          restore-keys: repo-${{ steps.key.outputs.tgt }}-

      - name: Sync Repo Caches
        id: sync
        env:
          GIT_TERMINAL_PROMPT: 0
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          SRC: ${{ inputs.source_repo_url }}
          TGT: ${{ inputs.target_repo_url }}
          BR: ${{ inputs.target_branch }}
          COMMIT_LIST: ${{ inputs.commit_shas }}
        run: |
          init_repo() { [ -d "$1" ] || git init -q --bare "$1"; }
          sync_branch() {
            init_repo "$1"
            remote=$(git ls-remote "$2" "refs/heads/$3" | awk -v r="refs/heads/$3" '$2==r{print $1}')
            if [ -z "$remote" ]; then
              echo "::error::Branch '$3' not found in remote"
              exit 1
            fi
            have=$(git --git-dir="$1" rev-parse -q --verify "refs/heads/$3" || true)
            if [ "$remote" = "$have" ]; then
              echo "Cache up to date for '$3' at $remote"
              return 0
            fi
            git --git-dir="$1" fetch -q --no-tags --no-write-fetch-head "$2" "+refs/heads/$3:refs/heads/$3"
            echo "$4=true" >> $GITHUB_OUTPUT
          }
          sync_sha() {
            init_repo "$1"
            if git --git-dir="$1" cat-file -e "$3^{commit}" 2>/dev/null; then
              echo "Commit $3 already cached"
              return 0
            fi
            git --git-dir="$1" fetch -q --no-tags --no-write-fetch-head "$2" "+$3:refs/cache/$3"
            echo "$4=true" >> $GITHUB_OUTPUT
          }
          sync_heads() {
            init_repo "$1"
            remote=$(git ls-remote --heads "$2" | sort | sha256sum)
            have=$(git --git-dir="$1" for-each-ref --format='%(objectname)%09%(refname)' refs/heads | sort | sha256sum)
            if [ "$remote" = "$have" ]; then
              echo "Cache up to date for all branches"
              return 0
            fi
            git --git-dir="$1" fetch -q --no-tags --no-write-fetch-head --prune "$2" "+refs/heads/*:refs/heads/*"
            echo "$3=true" >> $GITHUB_OUTPUT
          }

          AUTH_TGT=$(echo "$TGT" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")
          mkdir -p cache
          sync_heads cache/src.git "$SRC" src_changed
          for sha in $COMMIT_LIST; do
            sync_sha cache/src.git "$SRC" "$sha" src_changed
          done
          sync_branch cache/tgt.git "$AUTH_TGT" "$BR" tgt_changed
          if grep -qs "x-access-token" cache/*.git/config cache/*.git/FETCH_HEAD; then
            echo "::error::Credentials found in repo cache"
            exit 1
          fi

      - name: Save Source Cache
        if: steps.sync.outputs.src_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/src.git
          key: repo-${{ steps.key.outputs.src }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Target Cache
        if: steps.sync.outputs.tgt_changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache/tgt.git
          key: repo-${{ steps.key.outputs.tgt }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cherry-Pick Commits and Push
        env:
          TARGET_PAT: ${{ secrets.GLOBAL_REPO_PAT }}
          GIT_COMMITTER_NAME: "Justus"
          GIT_COMMITTER_EMAIL: "Justadeayo@users.noreply.github.com"
          TGT: ${{ inputs.target_repo_url }}
          BR: ${{ inputs.target_branch }}
          COMMIT_LIST: ${{ inputs.commit_shas }}
        run: |
          WS="$GITHUB_WORKSPACE"
          AUTH_TGT=$(echo "$TGT" | sed -E "s|https://|https://x-access-token:${TARGET_PAT}@|")
          mkdir -p work && cd work
          git init -q
          printf '%s\n%s\n' "$WS/cache/src.git/objects" "$WS/cache/tgt.git/objects" > .git/objects/info/alternates
          git checkout -q -B "$BR" "$(git --git-dir="$WS/cache/tgt.git" rev-parse "refs/heads/$BR")"

          for sha in $COMMIT_LIST; do
            if git cherry-pick -s -X theirs "$sha"; then
              echo "Successfully cherry-picked $sha"
            else
              git cherry-pick --abort || true

              git format-patch -1 "$sha" --stdout > "$RUNNER_TEMP/patch.diff"

              if git apply --3way "$RUNNER_TEMP/patch.diff"; then
                git add .
                git commit -s -C "$sha"
              else
                git apply --reject --whitespace=fix "$RUNNER_TEMP/patch.diff" || true
                find . -name "*.rej" -type f -delete

                git add .
                if ! git diff --cached --quiet; then
                  git commit -s -C "$sha"
                fi
              fi
              rm -f "$RUNNER_TEMP/patch.diff"
            fi
          done

          git push "$AUTH_TGT" "$BR"

  Cache_Cleanup:
    needs: cherry-pick
    if: ${{ needs.cherry-pick.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CACHE_LIMIT_GB: 8
      HASHES: ${{ needs.cherry-pick.outputs.src_hash }} ${{ needs.cherry-pick.outputs.tgt_hash }}
    steps:
      - name: Prune old repo caches
        run: |
          for h in $HASHES; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "repo-${h}-" --sort created_at --order desc --limit 100 --json id | jq -r '.[1:][].id' | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
          done
          LIMIT=$((CACHE_LIMIT_GB * 1024 * 1024 * 1024))
          gh cache list --repo "$GITHUB_REPOSITORY" --key "repo-" --sort last_accessed_at --order desc --limit 100 --json id,sizeInBytes | jq -r --argjson l "$LIMIT" 'foreach .[] as $c (0; . + $c.sizeInBytes; {id: $c.id, total: .}) | select(.total > $l) | .id' | xargs -r -I{} gh cache delete {} --repo "$GITHUB_REPOSITORY" || true
